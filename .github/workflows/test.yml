name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [all, all-clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install clang
        if: matrix.target == 'all-clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: make ${{ matrix.target }} (clean + codegen + tests + examples)
        run: make ${{ matrix.target }}
      - name: Check that include/hcbudoux.h is up to date
        run: git diff --exit-code -- include/hcbudoux.h
